{{# Stats — fields from block_stats: heading, stats (value, label) #}}
<section class="border-y border-white/10 bg-zinc-950 py-16">
    <div class="mx-auto max-w-6xl px-6">
        {{ partial:sets/common/heading tone="light" }}
        <dl class="grid grid-cols-2 gap-8 text-center lg:grid-cols-4 {{ if heading:text }}mt-12{{ /if }}">
            {{ stats }}
                <div class="flex flex-col-reverse">
                    <dt class="mt-2 text-sm uppercase tracking-widest text-zinc-400"{{ fine_builder_visual:field path="stats.{index}.label" }}>{{ label }}</dt>
                    <dd class="font-display text-5xl text-amber-300"{{ fine_builder_visual:field path="stats.{index}.value" }}>{{ value }}</dd>
                </div>
            {{ /stats }}
        </dl>
    </div>
</section>
